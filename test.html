
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Restaurant Ordering System</h1>

        

        <p id="result" class="message"></p>

    </div>

<div class="container">
        <!-- (Font Family) -->
        <select id="fontFamily" onchange="changeFontFamily()">
            <option value="Arial">Arial</option>
            <option value="Times New Roman">Times New Roman</option>
            <option value="Fantasy">Fantasy</option>
        </select>

        <!-- (Font Size) -->
        <select id="fontSize" onchange="changeFontSize()">
            <option value="10px">10px</option>
            <option value="15px">15px</option>
            <option value="20px">25px</option>
        </select>

        <!-- Checkbox  -->
        <label><input type="checkbox" id="italicCheck" onclick="toggleItalic()"> Italic</label>
        <label><input type="checkbox" id="boldCheck" onclick="toggleBold()"> Bold</label>
        <label><input type="checkbox" id="underlineCheck" onclick="toggleUnderline()"> Underline</label>

        
        </div><br><br>
        <!-- box -->
        <textarea id="textBox" rows="4" cols="55">the quick brown fox over the lazy dog</textarea><br><br><br><br>

   

    <script src="test.js"></script> 
</body>
</html>
