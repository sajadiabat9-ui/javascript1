
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Ordering System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Restaurant Ordering System</h1>

        <label for="customerName">Customer Name</label>
        <input type="text" id="customerName" placeholder="Enter your name">

        <label for="order">Choose Your Order</label>
        <select id="order">
            <option value="Burger">Burger</option>
            <option value="Shawarma">Shawarma</option>
            <option value="Zinger">Zinger</option>
        </select>

        <button
            id="submitBtn"
            onclick="displayOrder()"
            onmouseover="changeColor()"
            onmouseout="returnColor()">
            Submit
        </button>

        <p id="result" class="message"></p>

    </div>



   

    <script src="test.js"></script> 
</body>
</html>
